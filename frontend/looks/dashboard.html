<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - HealthVault AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="topbar">

    <a
        href="dashboard.html"
        class="brand"
    >

        <span class="brand-mark">
            HV
        </span>

        <div>

            <h1 style="font-size:1.2rem;">
                HealthVault AI
            </h1>

            <p class="tagline">
                Your personal health records, organized.
            </p>

        </div>

    </a>


    <nav class="tabs">

        <a
            class="tab-btn active"
            href="dashboard.html"
        >
            Overview
        </a>

        <a
            class="tab-btn"
            href="reports.html"
        >
            Reports
        </a>

        <a
            class="tab-btn"
            href="medications.html"
        >
            Medications
        </a>

        <a
            class="tab-btn"
            href="appointments.html"
        >
            Appointments
        </a>

        <a
            class="tab-btn"
            href="trends.html"
        >
            Trends
        </a>

    </nav>


    <button
        class="btn-ghost"
        onclick="signOut()"
    >
        Switch Patient
    </button>

</header>



<div class="page">


    <section class="card">

        <h2>
            Overview
        </h2>


        <div class="stat-row">


            <div class="stat-card">

                <span
                    class="stat-value"
                    id="stat-reports"
                >
                    0
                </span>

                <span class="stat-label">
                    Total Reports
                </span>

            </div>



            <div class="stat-card">

                <span
                    class="stat-value"
                    id="stat-medications"
                >
                    0
                </span>

                <span class="stat-label">
                    Active Medications
                </span>

            </div>



            <div class="stat-card">

                <span
                    class="stat-value"
                    id="stat-appointments"
                >
                    0
                </span>

                <span class="stat-label">
                    Upcoming Appointments
                </span>

            </div>



            <div class="stat-card">

                <span
                    class="stat-value"
                    id="stat-parameters"
                >
                    0
                </span>

                <span class="stat-label">
                    Parameters Tracked
                </span>

            </div>


        </div>

    </section>



    <section class="card">


        <h2>
            Profile
        </h2>


        <div class="profile-grid">


            <div>

                <span class="field-label">
                    Name
                </span>

                <span id="profile-name">
                    -
                </span>

            </div>



            <div>

                <span class="field-label">
                    Age
                </span>

                <span id="profile-age">
                    -
                </span>

            </div>



            <div>

                <span class="field-label">
                    Gender
                </span>

                <span id="profile-gender">
                    -
                </span>

            </div>



            <div>

                <span class="field-label">
                    Blood Group
                </span>

                <span id="profile-blood-group">
                    -
                </span>

            </div>



            <div>

                <span class="field-label">
                    Phone
                </span>

                <span id="profile-phone">
                    -
                </span>

            </div>


        </div>


        <p class="user-id-note">

            Patient ID:

            <code id="profile-user-id">
                -
            </code>

        </p>


    </section>


</div>



<script src="app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="api.js"></script>


<script>


const userId =
    requireUser();


if (userId) {

    Api.getDashboard(
        userId
    )

    .then(data => {


        if (data.notFound) {

            signOut();

            return;
        }


        const user =
            data.user || {};


        const reports =
            data.reports || [];


        const medications =
            data.medications || [];


        const appointments =
            data.appointments || [];


        const parameters =
            data.parameters || [];


        document
            .getElementById("stat-reports")
            .textContent =
                reports.length;


        document
            .getElementById("stat-medications")
            .textContent =
                medications.filter(
                    m => m.is_active !== false
                ).length;


        document
            .getElementById("stat-appointments")
            .textContent =
                appointments.filter(
                    a =>
                        a.status === "upcoming"
                ).length;


        document
            .getElementById("stat-parameters")
            .textContent =
                new Set(
                    parameters.map(
                        p => p.name
                    )
                ).size;


        document
            .getElementById("profile-name")
            .textContent =
                user.name || "-";


        document
            .getElementById("profile-age")
            .textContent =
                calcAge(
                    user.date_of_birth
                );


        document
            .getElementById("profile-gender")
            .textContent =
                user.gender || "-";


        document
            .getElementById("profile-blood-group")
            .textContent =
                user.blood_group || "-";


        document
            .getElementById("profile-phone")
            .textContent =
                user.phone || "-";


        document
            .getElementById("profile-user-id")
            .textContent =
                user.user_id || "-";

    })


    .catch(error => {

        console.error(
            "Dashboard error:",
            error
        );


        alert(
            `Could not load dashboard: ${error.message}`
        );

        signOut();

    });

}

</script>


</body>

</html>
